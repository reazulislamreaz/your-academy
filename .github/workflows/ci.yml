name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @your-academy/backend prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Migrations are backward-compatible (zero-downtime deploys)
        run: node scripts/check-migrations.mjs

      - name: Shellcheck deploy script
        run: shellcheck -S warning scripts/deploy.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @your-academy/backend test

      - name: Dependency audit (prod)
        run: pnpm audit --prod --audit-level=high || true

      - name: Build
        run: pnpm build
