name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/your-academy"
            fi
            cd "$APP_DIR"
            git fetch --prune origin
            git checkout main 2>/dev/null || git checkout master
            git pull --ff-only
            export ENV_FILE=.env.production
            chmod +x scripts/deploy.sh scripts/backup-db.sh scripts/restore-db.sh
            ./scripts/deploy.sh
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"
            if [ -n "$DOMAIN" ]; then
              curl -fsS "https://${DOMAIN}/health" >/dev/null
              curl -fsS "https://${DOMAIN}/ready" >/dev/null
              echo "Public health green for ${DOMAIN}"
            fi
