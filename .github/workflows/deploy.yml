name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/your-academy"
            fi
            cd "$APP_DIR"
            git fetch --prune origin
            git checkout main 2>/dev/null || git checkout master
            git pull --ff-only
            export ENV_FILE=.env.production
            chmod +x scripts/deploy.sh scripts/backup-db.sh scripts/restore-db.sh
            ./scripts/deploy.sh
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"
            if [ -n "$DOMAIN" ]; then
              # Prefer HTTPS; retry briefly (Cloudflare can briefly 525 during edge warm-up).
              ok=0
              for i in 1 2 3 4 5; do
                if curl -fsS "https://${DOMAIN}/ready" >/dev/null 2>&1; then
                  curl -fsS "https://${DOMAIN}/health" >/dev/null 2>&1 || true
                  echo "Public health green (https) for ${DOMAIN}"
                  ok=1
                  break
                fi
                if curl -fsS "http://${DOMAIN}/ready" >/dev/null 2>&1; then
                  echo "Public health green (http) for ${DOMAIN}"
                  ok=1
                  break
                fi
                sleep 3
              done
              if [ "$ok" -ne 1 ]; then
                echo "Public health check failed for ${DOMAIN}" >&2
                exit 1
              fi
            fi
