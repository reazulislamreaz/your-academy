worker_processes auto;

events {
  worker_connections 1024;
}

# Origin HTTP-only behind Cloudflare proxy (Flexible SSL).
# Browser ↔ Cloudflare = HTTPS; Cloudflare ↔ VPS = HTTP :80.
# Do NOT put TLS certificates on the VPS in this mode.
# When you want origin HTTPS (Full / Full Strict), switch to nginx.prod.conf + real certs.
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
  }

  upstream api_upstream {
    server api:5000 max_fails=3 fail_timeout=10s;
  }

  map $http_x_forwarded_proto $edge_proto {
    default $scheme;
    https   https;
    http    http;
  }

  # Shared proxy defaults — retry briefly during rolling deploys (connection refused → 502).
  proxy_http_version 1.1;
  # Upstreams share a Docker bridge (connect < 1 ms). A short timeout fails over fast when a
  # container was just replaced by a deploy (its old IP no longer answers).
  proxy_connect_timeout 2s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 10s;

  server {
    listen 80;
    server_name youracademy.com.bd www.youracademy.com.bd _;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'self';" always;

    location ^~ /api/pdf/ {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_next_upstream off;
    }

    location /health {
      proxy_pass http://api_upstream/health;
      proxy_set_header Host $host;
    }

    location /ready {
      proxy_pass http://api_upstream/ready;
      proxy_set_header Host $host;
    }

    location ^~ /_next/static/ {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /images/ {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
    }
  }
}
