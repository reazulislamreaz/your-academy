worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Docker embedded DNS — re-resolve service IPs after container recreate
  # (avoids stale upstream IPs → connection refused → Cloudflare 502/520).
  # Keep valid=30s to reduce concurrent resolver races ("wrong ident in DNS response").
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  # RL-1 / RL-4: trust Cloudflare's CF-Connecting-IP only from Cloudflare ranges.
  include /etc/nginx/ya/cloudflare-real-ip.conf;

  # Edge rate limit (complements Nest throttles).
  limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=30r/s;

  # Shared proxy defaults — retry briefly during rolling deploys.
  proxy_http_version 1.1;
  # Upstreams share a Docker bridge (connect < 1 ms). A short timeout fails over fast when a
  # container was just replaced by a deploy (its old IP no longer answers).
  proxy_connect_timeout 2s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 10s;

  # HTTP → HTTPS (ACME HTTP-01 still reachable if needed later)
  server {
    listen 80 backlog=4096;
    server_name youracademy.com.bd www.youracademy.com.bd _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      # One canonical host (SEO): www goes straight to the apex — no http→https→apex chain.
      if ($host = www.youracademy.com.bd) {
        return 301 https://youracademy.com.bd$request_uri;
      }
      return 301 https://$host$request_uri;
    }
  }

  server {
    # backlog matches host somaxconn; helps absorb Cloudflare connection bursts (525 under SYN drops).
    listen 443 ssl backlog=4096;
    # Prefer HTTP/1.1 from Cloudflare→origin (CF origin_max_http_version=1). Keep http2 off
    # at the origin to avoid intermittent TLS/session issues some edges surface as 525.
    server_name youracademy.com.bd www.youracademy.com.bd _;

    # One canonical host (SEO): https://www → https://apex, same path and query.
    if ($host = www.youracademy.com.bd) {
      return 301 https://youracademy.com.bd$request_uri;
    }

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Note: YE intermediate certs may omit OCSP URLs — leave stapling off to avoid nginx warn.

    client_max_body_size 25m;
    limit_req zone=edge_limit burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'self';" always;

    # Next.js PDF byte proxies (DEC-033) — must hit web, not Nest.
    location ^~ /api/pdf/ {
      set $upstream_web web:3000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # X-Forwarded-For / CF-Connecting-IP are SET to $remote_addr below (never appended): the origin
    # is the first proxy, so client-supplied values must not reach the app's rate limiter (RL-1b).
    location /api/ {
      set $upstream_api api:5000;
      proxy_pass http://$upstream_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Socket.IO (DEC-029 support chat)
    location /socket.io/ {
      set $upstream_api api:5000;
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_next_upstream off;
    }

    location /health {
      set $upstream_api api:5000;
      proxy_pass http://$upstream_api/health;
      proxy_set_header Host $host;
    }

    location /ready {
      set $upstream_api api:5000;
      proxy_pass http://$upstream_api/ready;
      proxy_set_header Host $host;
    }

    location ^~ /_next/static/ {
      set $upstream_web web:3000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /images/ {
      set $upstream_web web:3000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location / {
      set $upstream_web web:3000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
