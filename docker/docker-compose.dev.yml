# Dev overrides: publish DB/Redis/API/Web ports for local tooling.
services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

  api:
    ports:
      - '${API_PORT:-3001}:3001'

  web:
    ports:
      - '${PORT:-3000}:3000'

  nginx:
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
