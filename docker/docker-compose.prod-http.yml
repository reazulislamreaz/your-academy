# Origin HTTP-only behind Cloudflare proxy (Flexible SSL — no certs on the VPS).
#   docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.prod.yml \
#     -f docker/docker-compose.prod-http.yml \
#     --env-file .env.production up -d --build
#
# Keep COOKIE_SECURE / WEB_ORIGIN as https://… so browsers using Cloudflare HTTPS
# still get Secure cookies. Cloudflare terminates TLS; origin speaks plain HTTP :80.
# When ready for origin TLS (Full / Full Strict), omit this file and use nginx.prod.conf.

services:
  nginx:
    ports: !override
      - '80:80'
    volumes: !override
      - ./nginx/nginx.prod-http.conf:/etc/nginx/nginx.conf:ro
